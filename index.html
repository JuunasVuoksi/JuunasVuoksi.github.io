<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Osteria del Sol – tilausjärjestelmä</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #fbf6eb; color: #39291d; font: 14px system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    main { flex: 1; position: relative; min-height: 0; }
    canvas { width: 100%; height: 100%; display: block; }
    #loading { position: absolute; inset: 0; display: grid; place-content: center; gap: 16px; text-align: center; }
    progress { width: 280px; accent-color: #b95134; }
    footer { padding: 7px 16px; text-align: center; }
    #error { position: absolute; top: 10px; left: 10%; right: 10%; background: #fff1e9; padding: 16px; border: 1px solid #b95134; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main id="player">
    <canvas id="unity-canvas" tabindex="0" aria-label="Osteria del Sol -harjoitus"></canvas>
    <div id="loading"><strong>Osteria del Sol</strong><span>Ladataan harjoitusta…</span><progress id="progress" max="1" value="0"></progress></div>
    <div id="error" hidden role="alert"></div>
  </main>
  <footer>Tilaukset ja tietokanta tallennetaan vain tähän selaimeen. Lataa tärkeät tilaukset JSON-tiedostoina. Lopeta sulkemalla välilehti.</footer>
  <script>
    const canvas = document.getElementById('unity-canvas');
    function showError(message) {
      const error = document.getElementById('error');
      error.textContent = message; error.hidden = false;
    }
    const config = {
      arguments: [],
      dataUrl: 'Build/Ravinteli_web.data.unityweb',
      frameworkUrl: 'Build/Ravinteli_web.framework.js.unityweb',
      codeUrl: 'Build/Ravinteli_web.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "Osteria del Sol",
      productName: "Restaurant Menu",
      productVersion: "1.0",
      autoSyncPersistentDataPath: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner: function(message, type) { if (type === 'error') showError(message); else console.warn(message); }
    };
    // Explicit test URLs use isolated storage; ordinary launches never run tests.
    const query = new URLSearchParams(location.search);
    const mode = query.get('osteriaTest'), run = query.get('run');
    if (/^[a-zA-Z0-9-]{1,64}$/.test(run || '') && ['smoke', 'seed', 'reload', 'archived'].includes(mode)) {
      const root = '/idbfs/osteria-verification/' + run;
      config.arguments = ['-osteriaTestData', root];
      if (mode === 'smoke') config.arguments.push('-osteriaSmokeTest', root + '/results');
      else config.arguments.push('-osteriaPersistenceTest', mode);
    }
    const script = document.createElement('script');
    script.src = 'Build/Ravinteli_web.loader.js';
    script.onerror = () => showError('Lataus epäonnistui. Avaa sovellus HTTP- tai HTTPS-palvelimelta ja tarkista verkkoyhteys.');
    script.onload = () => createUnityInstance(canvas, config, value => document.getElementById('progress').value = value)
      .then(instance => { window.osteriaInstance = instance; document.getElementById('loading').remove(); canvas.focus(); })
      .catch(error => showError(String(error)));
    document.body.appendChild(script);
  </script>
</body>
</html>
